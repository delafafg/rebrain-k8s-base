apiVersion: v1
kind: Service
metadata:
  name: mysql-headless
  namespace: db
spec:
  ports:
  - port: 3306
  selector:
    app: db
  clusterIP: None
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: db
spec:
  ports:
  - port: 3306
  selector:
    app: db
---
apiVersion: v1
kind: Secret
metadata:
   name: mysql-secret
   namespace: db
   labels:
     app: db
type: Opaque
data:
  mysql-root-password: ZGJfcGFzcw== # db_pass
  mysql-user: ZGJfdXNlcg== # db_user
  mysql-password: ZGJfcGFzcw== # db_pass
---
apiVersion: v1
